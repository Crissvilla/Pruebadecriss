<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Intranet · Majori Sushi</title>
  <link rel="icon" href="/img/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <!-- Login -->
  <section id="login-view" class="login" hidden>
    <form id="login-form" class="login-card">
      <img src="/img/logo.png" alt="" width="96" height="96">
      <h1>Intranet Majori</h1>
      <p class="muted">Ingresa para administrar la página, la carta y los pedidos.</p>
      <label>Usuario<input name="username" autocomplete="username" required></label>
      <label>Clave<input name="password" type="password" autocomplete="current-password" required></label>
      <p class="error" id="login-error" role="alert"></p>
      <button class="btn primary block">Ingresar</button>
      <a href="/" class="muted small">← Volver a la página</a>
    </form>
  </section>

  <!-- App -->
  <div id="app-view" class="app" hidden>
    <aside class="sidebar">
      <div class="side-brand">
        <img src="/img/logo.png" alt="" width="40" height="40">
        <div><strong>Majori</strong><small>Intranet</small></div>
      </div>
      <nav id="side-nav">
        <a href="#resumen" data-view="resumen">📊 Resumen</a>
        <a href="#pedidos" data-view="pedidos">🧾 Pedidos <b id="pending-badge" class="pill" hidden></b></a>
        <a href="#carta" data-view="carta">🍣 Carta y productos</a>
        <a href="#local" data-view="local" data-admin>🏪 Información del local</a>
        <a href="#usuarios" data-view="usuarios" data-admin>👥 Usuarios</a>
        <a href="#respaldo" data-view="respaldo" data-admin>💾 Respaldo</a>
      </nav>
      <div class="side-foot">
        <a href="/" target="_blank" rel="noopener">Ver página ↗</a>
        <button class="link" id="change-pass-btn">Cambiar clave</button>
        <button class="link" id="logout">Cerrar sesión</button>
        <small id="who" class="muted"></small>
      </div>
    </aside>
    <main class="content" id="content"></main>
  </div>

  <dialog id="dlg" class="dlg"><div id="dlg-body"></div></dialog>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="/admin/admin.js"></script>
</body>
</html>
